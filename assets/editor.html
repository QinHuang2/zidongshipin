<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>纸上视频 · 标注编辑器</title>
<style>body{margin:24px;background:#f5ebd7;color:#34302a;font:16px system-ui}main{display:grid;grid-template-columns:2fr 1fr;gap:24px}canvas{width:100%;background:#f5ebd7;border:1px solid #b9ab94}textarea{width:100%;height:65vh;box-sizing:border-box;font:13px monospace}button,label{margin:8px 12px 8px 0}input[type=range]{width:70%}#status{white-space:pre-wrap}small{display:block;margin:12px 0}@media(max-width:800px){main{display:block}}</style>
<h1>纸上视频 · 标注编辑器</h1><p>载入图片与标注，修改右侧 JSON 后应用；导出 JSON 替换原标注。框内拖动可移动区域。</p>
<label>图片 <input id="picture" type="file" accept="image/png,image/jpeg"></label><label>标注 <input id="annotation" type="file" accept=".json"></label>
<main><section><canvas id="canvas"></canvas><p><input id="time" type="range" min="0" value="0"><output id="clock">0 ms</output></p><label><input id="proxy" type="checkbox">时序代理预览</label><small>预览模拟区域揭示，真实勾线与上色请以命令行渲染 MP4 为准。编号与边框不会进入成片。</small></section><section><textarea id="json" spellcheck="false"></textarea><button id="apply">应用修改</button><button id="save">下载标注</button><p id="status" role="status"></p></section></main>
<script>
const $=id=>document.getElementById(id);let img=null,data=null,fileName='scene.json',drag=null;
function status(text){$('status').textContent=text}
function check(d){if(!img)throw Error('请先载入图片');if(JSON.stringify(d.canvas)!==JSON.stringify([img.naturalWidth,img.naturalHeight]))throw Error('canvas 与图片尺寸不匹配');if(!Number.isInteger(d.durationMs)||d.durationMs<501)throw Error('durationMs 无效');if(!Array.isArray(d.elements)||!d.elements.length)throw Error('elements 为空');let end=0,ids=new Set;const valid=r=>Array.isArray(r)&&r.length===4&&r.every(Number.isInteger)&&r[0]>=0&&r[1]>=0&&r[2]>0&&r[3]>0&&r[0]+r[2]<=d.canvas[0]&&r[1]+r[3]<=d.canvas[1];for(const e of d.elements){if(!e.id||ids.has(e.id))throw Error('id 为空或重复');ids.add(e.id);if(!valid(e.region)||!(e.protected||[]).every(valid))throw Error('区域超出画布');if(!Number.isInteger(e.startMs)||!Number.isInteger(e.endMs)||e.startMs<end||e.endMs<=e.startMs||e.endMs>d.durationMs-500)throw Error('时间重叠或结尾不足 500ms');if(typeof e.subtitle!=='string'||!e.subtitle.trim())throw Error('缺少字幕关联');end=e.endMs}}
function apply(){const candidate=JSON.parse($('json').value);check(candidate);data=candidate;$('time').max=data.durationMs;draw();status('校验通过；下载后用新标注渲染。')}
function sync(){ $('json').value=JSON.stringify(data,null,2);draw() }
function draw(){if(!img)return;const c=$('canvas'),ctx=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;ctx.fillStyle='#f5ebd7';ctx.fillRect(0,0,c.width,c.height);const t=+$('time').value;$('clock').textContent=t+' ms';if(!$('proxy').checked||!data)ctx.drawImage(img,0,0);else data.elements.forEach((e,i)=>{let p=Math.max(0,Math.min(1,(t-e.startMs)/(e.endMs-e.startMs)));if(!p)return;const layer=document.createElement('canvas');layer.width=c.width;layer.height=c.height;const q=layer.getContext('2d'),[x,y,w,h]=e.region;q.save();q.beginPath();q.rect(x,y,w,h*p);q.clip();q.drawImage(img,0,0);q.restore();q.globalCompositeOperation='destination-out';for(const r of [...data.elements.slice(i+1).map(x=>x.region),...(e.protected||[])])q.fillRect(...r);ctx.drawImage(layer,0,0)});if(data)data.elements.forEach((e,i)=>{ctx.strokeStyle='#c54d32';ctx.lineWidth=Math.max(2,c.width/600);ctx.strokeRect(...e.region);ctx.fillStyle='#c54d32';ctx.font=Math.max(16,c.width/60)+'px sans-serif';ctx.fillText((i+1)+' '+(e.label||e.id),e.region[0]+4,e.region[1]+24)})}
$('picture').onchange=async e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),next=new Image();next.onload=()=>{img=next;data=null;$('json').value='';draw();URL.revokeObjectURL(url);status('图片已载入，请载入同名标注')};next.src=url};
$('annotation').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;fileName=f.name;$('json').value=await f.text();apply()}catch(e){status(e.message)}};
$('apply').onclick=()=>{try{apply()}catch(e){status(e.message)}};
$('save').onclick=()=>{try{apply();const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=fileName;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){status(e.message)}};
$('time').oninput=draw;$('proxy').onchange=draw;
function point(e){const r=$('canvas').getBoundingClientRect();return[(e.clientX-r.left)*$('canvas').width/r.width,(e.clientY-r.top)*$('canvas').height/r.height]}
$('canvas').onpointerdown=e=>{if(!data||$('proxy').checked)return;const [x,y]=point(e);for(let i=data.elements.length-1;i>=0;i--){const r=data.elements[i].region;if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3]){drag={i,dx:x-r[0],dy:y-r[1]};$('canvas').setPointerCapture(e.pointerId);break}}};
$('canvas').onpointermove=e=>{if(!drag)return;const [x,y]=point(e),r=data.elements[drag.i].region;r[0]=Math.round(Math.max(0,Math.min(data.canvas[0]-r[2],x-drag.dx)));r[1]=Math.round(Math.max(0,Math.min(data.canvas[1]-r[3],y-drag.dy)));sync()};$('canvas').onpointerup=()=>drag=null;$('canvas').onpointercancel=()=>drag=null;
</script></html>
